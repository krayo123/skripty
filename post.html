<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Script — NAME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050508;
      --bg2: #0a0a12;
      --surface: #0e0e1a;
      --border: #1a1a2e;
      --green: #00ff88;
      --green-dim: #00cc6a;
      --green-glow: rgba(0,255,136,0.18);
      --green-subtle: rgba(0,255,136,0.06);
      --red: #ff3355;
      --text: #c8d8c8;
      --text-muted: #5a6a5a;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', monospace;
      --font-body: 'Rajdhani', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(0,255,136,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5,5,8,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(16px, 4vw, 48px);
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .logo {
      font-family: var(--font-display);
      font-size: clamp(13px, 2.5vw, 18px);
      font-weight: 900;
      color: var(--green);
      text-decoration: none;
      letter-spacing: 3px;
      text-shadow: 0 0 20px var(--green-glow);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 0 10px var(--green);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.2s;
    }

    .back-btn:hover { color: var(--green); }

    .back-btn svg { width: 14px; height: 14px; }

    /* ── MAIN ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: clamp(30px,5vw,60px) clamp(16px,4vw,48px) 80px;
      position: relative;
      z-index: 1;
    }

    /* ── BREADCRUMB ── */
    .breadcrumb {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 2px;
      margin-bottom: 20px;
      animation: fadeUp 0.4s ease both;
    }

    .breadcrumb span { color: var(--green); }

    /* ── TITLE ── */
    #postTitle {
      font-family: var(--font-display);
      font-size: clamp(18px, 4vw, 30px);
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 30px;
      letter-spacing: 1px;
      animation: fadeUp 0.4s 0.05s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── VIDEO ── */
    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 30px;
      animation: fadeUp 0.4s 0.1s ease both;
      overflow: hidden;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── AD PLACEHOLDER ── */
    .ad-zone {
      background: var(--surface);
      border: 1px dashed var(--border);
      padding: 20px;
      text-align: center;
      margin-bottom: 30px;
      animation: fadeUp 0.4s 0.15s ease both;
    }

    .ad-zone p {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 2px;
    }

    /* ── GET SCRIPT SECTION ── */
    .get-script {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: clamp(24px, 4vw, 40px);
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.4s 0.2s ease both;
    }

    .get-script::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--green) 0%, transparent 100%);
    }

    .get-script-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .get-script h2 {
      font-family: var(--font-display);
      font-size: clamp(14px, 2.5vw, 20px);
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .get-script p {
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 28px;
      font-weight: 400;
    }

    /* ── LOOTLABS BUTTON ── */
    .lootlabs-btn {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: var(--green);
      color: #000;
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 16px 32px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
      border: none;
    }

    .lootlabs-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
    }

    .lootlabs-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,255,136,0.4);
    }

    .lootlabs-btn:active { transform: translateY(0); }

    .lootlabs-logo {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      object-fit: contain;
      background: rgba(0,0,0,0.2);
      padding: 2px;
    }

    .lootlabs-btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .lootlabs-btn-sub {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 2px;
      opacity: 0.7;
    }

    .btn-arrow {
      margin-left: auto;
    }

    .btn-arrow svg {
      width: 16px;
      height: 16px;
    }

    /* ── INFO BOX ── */
    .info-box {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 20px;
      padding: 14px;
      border: 1px solid var(--border);
      background: rgba(0,255,136,0.03);
    }

    .info-box svg {
      width: 16px;
      height: 16px;
      color: var(--green);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .info-box p {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      line-height: 1.6;
      margin: 0;
    }

    /* ── LOADING / ERROR ── */
    .state-box {
      text-align: center;
      padding: 80px 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .loader {
      display: inline-block;
      width: 40px;
      height: 2px;
      background: var(--border);
      position: relative;
      margin-bottom: 20px;
    }

    .loader::after {
      content: '';
      position: absolute;
      left: 0; top: 0;
      height: 100%;
      width: 40%;
      background: var(--green);
      animation: load 1s ease-in-out infinite;
    }

    @keyframes load {
      0% { left: 0; }
      50% { left: 60%; }
      100% { left: 0; }
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 20px clamp(16px,4vw,48px);
      text-align: center;
    }

    footer p {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 2px;
    }

    footer span { color: var(--green); }

    @media (max-width: 600px) {
      .lootlabs-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-dot"></div>
        <img src="LINKDOLOGO" alt="Logo" style="height:28px;display:none;" id="headerLogo" onerror="this.style.display='none'" onload="this.style.display='block';document.querySelector('.logo span').style.display='none'" />
        <span>NAME</span>
      </a>
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        WRÓĆ
      </a>
    </div>
  </header>

  <main id="content">
    <div class="state-box" id="loadingState">
      <div class="loader"></div>
      <p>ŁADOWANIE...</p>
    </div>
  </main>

  <footer>
    <p>© NAME — <span>FREE ROBLOX SCRIPTS</span></p>
  </footer>

  <script>
    // ── CONFIG ── ZAMIEŃ NA SWOJE DANE SUPABASE
    const SUPABASE_URL  = 'https://vwiwgbvtkjyerqpjbkfc.supabase.co/rest/v1/';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3aXdnYnZ0a2p5ZXJxcGpia2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTg5NjIsImV4cCI6MjA5NjE3NDk2Mn0.uqMgkZTVOm0NmU54HSlQe33BeAfYxFPj5xzA_IfsXB8';

    // ── UTILS ──
    function getYTId(url) {
      const m = url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    async function getYTTitle(url) {
      try {
        const r = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
        const d = await r.json();
        return d.title || 'Roblox Script';
      } catch { return 'Roblox Script'; }
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── LOAD POST ──
    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) { showError('Brak ID skryptu'); return; }

      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/scripts?id=eq.${id}&select=*&limit=1`,
          { headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` } }
        );
        if (!res.ok) throw new Error();
        const [script] = await res.json();
        if (!script) throw new Error('not found');

        const title = await getYTTitle(script.youtube_link);
        const ytId = getYTId(script.youtube_link);

        document.title = `${title} — NAME`;
        render(script, title, ytId);
      } catch (err) {
        showError('Nie znaleziono skryptu');
      }
    }

    function render(script, title, ytId) {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="breadcrumb">
          <a href="index.html" style="color:inherit;text-decoration:none;">HOME</a>
          &nbsp;/&nbsp;
          <span>SCRIPT</span>
        </div>

        <h1 id="postTitle">${escHtml(title)}</h1>

        <div class="video-wrap">
          ${ytId
            ? `<iframe src="https://www.youtube.com/embed/${ytId}?rel=0&modestbranding=1" allowfullscreen allow="autoplay; encrypted-media"></iframe>`
            : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--font-mono);font-size:12px;color:var(--text-muted);">BRAK WIDEO</div>`
          }
        </div>

        <!-- ADSTERRA AD ZONE - wklej swój kod tutaj -->
        <div class="ad-zone">
          <!-- WKLEJ KOD REKLAMY ADSTERRA TUTAJ -->
          <p>[ REKLAMA ]</p>
        </div>

        <div class="get-script">
          <div class="get-script-label">// DOSTĘP DO SKRYPTU</div>
          <h2>POBIERZ SKRYPT</h2>
          <p>Kliknij poniżej, żeby odblokować i pobrać skrypt za darmo przez Lootlabs.</p>

          <a href="${escHtml(script.lootlabs_link)}" target="_blank" rel="noopener noreferrer" class="lootlabs-btn">
            <img
              class="lootlabs-logo"
              src="https://i.imgur.com/chWRq9O.png"
              alt="Lootlabs"
              onerror="this.style.display='none'"
            />
            <div class="lootlabs-btn-text">
              GET SCRIPT
              <span class="lootlabs-btn-sub">VIA LOOTLABS</span>
            </div>
            <div class="btn-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </div>
          </a>

          <div class="info-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <p>Skrypt jest w 100% darmowy. Lootlabs służy do weryfikacji — po wykonaniu krótkiego zadania zostaniesz przekierowany do skryptu.</p>
          </div>
        </div>
      `;
    }

    function showError(msg) {
      document.getElementById('content').innerHTML = `
        <div class="state-box">
          <p style="color:var(--red)">${msg}</p>
          <br/>
          <a href="index.html" style="font-family:var(--font-mono);font-size:11px;color:var(--green);text-decoration:none;letter-spacing:2px;">← WRÓĆ DO STRONY GŁÓWNEJ</a>
        </div>`;
    }

    loadPost();
  </script>
</body>
</html>
