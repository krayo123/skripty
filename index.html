<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAME — Roblox Scripts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050508;
      --bg2: #0a0a12;
      --surface: #0e0e1a;
      --border: #1a1a2e;
      --green: #00ff88;
      --green-dim: #00cc6a;
      --green-glow: rgba(0,255,136,0.18);
      --green-subtle: rgba(0,255,136,0.06);
      --red: #ff3355;
      --text: #c8d8c8;
      --text-muted: #5a6a5a;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', monospace;
      --font-body: 'Rajdhani', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scanlines overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* Ambient glow */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(0,255,136,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5,5,8,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(16px, 4vw, 48px);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .logo {
      font-family: var(--font-display);
      font-size: clamp(14px, 3vw, 20px);
      font-weight: 900;
      color: var(--green);
      text-decoration: none;
      letter-spacing: 3px;
      text-shadow: 0 0 20px var(--green-glow);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 0 10px var(--green);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .header-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      text-align: center;
      padding: clamp(40px, 8vw, 80px) clamp(16px, 4vw, 48px) clamp(30px, 5vw, 50px);
      z-index: 1;
    }

    .hero-label {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--green);
      letter-spacing: 4px;
      text-transform: uppercase;
      border: 1px solid rgba(0,255,136,0.3);
      padding: 4px 14px;
      margin-bottom: 20px;
      animation: fadeUp 0.6s ease both;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(28px, 6vw, 64px);
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
      line-height: 1.1;
      margin-bottom: 12px;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .hero h1 span {
      color: var(--green);
      text-shadow: 0 0 30px rgba(0,255,136,0.5);
    }

    .hero-sub {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 1px;
      animation: fadeUp 0.6s 0.2s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── SEARCH ── */
    .search-wrap {
      max-width: 560px;
      margin: 28px auto 0;
      position: relative;
      animation: fadeUp 0.6s 0.3s ease both;
    }

    .search-wrap::before {
      content: '>';
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      color: var(--green);
      font-size: 16px;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 14px 16px 14px 36px;
      outline: none;
      letter-spacing: 1px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #searchInput::placeholder { color: var(--text-muted); }

    #searchInput:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), inset 0 0 20px rgba(0,255,136,0.04);
    }

    /* ── MAIN GRID ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 clamp(16px, 4vw, 48px) 60px;
      position: relative;
      z-index: 1;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    #scriptCount {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--green);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      display: block;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
      animation: fadeUp 0.4s ease both;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--green-subtle);
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 0;
    }

    .card:hover {
      border-color: rgba(0,255,136,0.4);
      transform: translateY(-2px);
    }

    .card:hover::before { opacity: 1; }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
      filter: grayscale(20%) contrast(1.05);
      transition: filter 0.3s;
    }

    .card:hover .card-thumb { filter: grayscale(0%) contrast(1.1); }

    .card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .card-thumb-placeholder svg {
      width: 40px;
      height: 40px;
      opacity: 0.2;
    }

    .card-overlay {
      position: absolute;
      top: 0; right: 0;
      background: rgba(0,255,136,0.9);
      color: #000;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 1px;
      padding: 3px 7px;
      font-weight: bold;
      z-index: 2;
    }

    .card-body {
      padding: 14px 16px;
      position: relative;
      z-index: 1;
    }

    .card-title {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 15px;
      color: #e8f0e8;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--green);
      letter-spacing: 1px;
    }

    .card-arrow {
      width: 20px;
      height: 20px;
      border: 1px solid rgba(0,255,136,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .card:hover .card-arrow {
      background: var(--green);
      border-color: var(--green);
    }

    .card:hover .card-arrow svg { color: #000; }

    .card-arrow svg {
      width: 10px;
      height: 10px;
      color: var(--green);
      transition: color 0.2s;
    }

    /* ── STATES ── */
    .loading-state, .empty-state, .error-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
    }

    .loading-state {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
    }

    .loader {
      display: inline-block;
      width: 40px;
      height: 2px;
      background: var(--border);
      position: relative;
      margin-bottom: 20px;
    }

    .loader::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 40%;
      background: var(--green);
      animation: load 1s ease-in-out infinite;
    }

    @keyframes load {
      0% { left: 0; }
      50% { left: 60%; }
      100% { left: 0; }
    }

    .empty-state svg, .error-state svg {
      width: 48px;
      height: 48px;
      opacity: 0.2;
      margin-bottom: 16px;
    }

    .empty-state p, .error-state p {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 20px clamp(16px, 4vw, 48px);
      text-align: center;
    }

    footer p {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 2px;
    }

    footer span { color: var(--green); }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr 1fr; gap: 1px; }
    }
    @media (max-width: 400px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-dot"></div>
        <img src="LINKDOLOGO" alt="Logo" style="height:28px;display:none;" id="headerLogo" onerror="this.style.display='none'" onload="this.style.display='block';document.querySelector('.logo span').style.display='none'" />
        <span>NAME</span>
      </a>
      <div class="header-tag">// ROBLOX SCRIPTS</div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-label">FREE SCRIPTS</div>
    <h1>ROBLOX <span>SCRIPTS</span></h1>
    <p class="hero-sub">// darmowe skrypty do roblox — codziennie nowe</p>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="szukaj skryptu..." autocomplete="off" spellcheck="false" />
    </div>
  </section>

  <main class="container">
    <div class="section-header">
      <div class="section-title">SKRYPTY</div>
      <div class="section-line"></div>
      <div id="scriptCount"></div>
    </div>

    <div class="grid" id="grid">
      <div class="loading-state">
        <div class="loader"></div>
        <p>ŁADOWANIE SKRYPTÓW...</p>
      </div>
    </div>
  </main>

  <footer>
    <p>© NAME — <span>FREE ROBLOX SCRIPTS</span></p>
  </footer>

  <script>
    // ── CONFIG ──
    // ZAMIEŃ TE WARTOŚCI NA SWOJE Z SUPABASE
    const SUPABASE_URL    = 'https://TWOJ_PROJECT_ID.supabase.co';
    const SUPABASE_ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3aXdnYnZ0a2p5ZXJxcGpia2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTg5NjIsImV4cCI6MjA5NjE3NDk2Mn0.uqMgkZTVOm0NmU54HSlQe33BeAfYxFPj5xzA_IfsXB8';

    // ── YOUTUBE UTILS ──
    function getYTId(url) {
      const m = url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function getYTThumb(id) {
      return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
    }

    // ── FETCH TITLE FROM NOEMBED ──
    async function getYTTitle(url) {
      try {
        const r = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
        const d = await r.json();
        return d.title || 'Roblox Script';
      } catch {
        return 'Roblox Script';
      }
    }

    // ── FETCH SCRIPTS ──
    let allScripts = [];

    async function fetchScripts() {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/scripts?select=*&order=created_at.desc`,
          { headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` } }
        );
        if (!res.ok) throw new Error('Fetch failed');
        const data = await res.json();

        // Pobierz tytuły równolegle
        const enriched = await Promise.all(data.map(async (row) => {
          const title = await getYTTitle(row.youtube_link);
          return { ...row, title };
        }));

        allScripts = enriched;
        renderGrid(allScripts);
      } catch (err) {
        document.getElementById('grid').innerHTML = `
          <div class="error-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <p>BŁĄD ŁADOWANIA — sprawdź konfigurację Supabase</p>
          </div>`;
      }
    }

    // ── RENDER ──
    function renderGrid(scripts) {
      const grid = document.getElementById('grid');
      const count = document.getElementById('scriptCount');
      count.textContent = `[${scripts.length}]`;

      if (!scripts.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <p>BRAK WYNIKÓW</p>
          </div>`;
        return;
      }

      grid.innerHTML = scripts.map((s, i) => {
        const ytId = getYTId(s.youtube_link);
        const thumb = ytId ? getYTThumb(ytId) : null;
        const thumbHtml = thumb
          ? `<img class="card-thumb" src="${thumb}" alt="${s.title}" loading="lazy" />`
          : `<div class="card-thumb-placeholder"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>`;

        return `
          <a class="card" href="post.html?id=${s.id}" style="animation-delay:${i * 0.04}s">
            <div class="card-overlay">SCRIPT</div>
            ${thumbHtml}
            <div class="card-body">
              <div class="card-title">${escHtml(s.title)}</div>
              <div class="card-meta">
                <span class="card-tag">FREE</span>
                <div class="card-arrow">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
              </div>
            </div>
          </a>`;
      }).join('');
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── SEARCH ──
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) { renderGrid(allScripts); return; }
      renderGrid(allScripts.filter(s => s.title.toLowerCase().includes(q)));
    });

    // ── INIT ──
    fetchScripts();
  </script>
</body>
</html>
